name: Build

# Debian sid's wpewebkit, rebuilt for trixie arm64 without the features the mirror never uses, and
# published as a release that the MirrorDash OS image installs. Trixie's own WPE (2.48.3) gets no security fixes ("wpewebkit is
# generally unsupported from bookworm onwards", Debian's security-support.deb13).
# Started by check.yml when sid has a new version, or by hand.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Debian source version of wpewebkit (sid), e.g. 2.54.2-1"
        required: true

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    container: debian:trixie
    defaults:
      run:
        shell: bash  # a container step runs sh otherwise
    env:
      VERSION: ${{ inputs.version }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPRESS: "1"
      # Debian's rules pick clang through CMake; CMake reads these as its compiler launcher
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      DEBFULLNAME: MirrorDash CI
      # Our build of a Debian version: one up when the build itself changes (the tag and the package's version)
      MIRRORDASH_BUILD: "2"
      DEBEMAIL: noreply@github.com
    steps:
      - name: Tools and Debian's signed source
        run: |
          [[ "$VERSION" =~ ^[0-9][0-9.]*-[0-9]+$ ]] || { echo "Not a Debian version: $VERSION"; exit 1; }
          apt-get update
          apt-get install -y --no-install-recommends devscripts debian-keyring ccache ca-certificates dpkg-dev equivs procps curl
          mkdir src && cd src
          # dget checks the .dsc's signature against Debian's keyring and the files against the .dsc
          dget "https://deb.debian.org/debian/pool/main/w/wpewebkit/wpewebkit_${VERSION}.dsc"

      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-${{ inputs.version }}-${{ github.run_id }}
          restore-keys: ccache-

      - name: Build
        timeout-minutes: 330
        run: |
          cd src/wpewebkit-*/
          apt-get build-dep -y .
          dch -v "${VERSION}~mirrordash${MIRRORDASH_BUILD}" --distribution trixie --force-distribution \
            "Rebuilt for trixie, whose own WPE gets no security fixes, without what the MirrorDash screen never uses."
          # No precompiled headers: each runner builds them with different bytes, so ccache could reuse
          # no object compiled against one (learnt from dariyooo/wpe-webkit-binaries)
          sed -i 's/^EXTRA_CMAKE_ARGUMENTS = -DPORT=WPE /&-DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON /' debian/rules
          grep -q DISABLE_PRECOMPILE_HEADERS debian/rules
          # Off: what the mirror's screen never uses (speech, spell checking, XSLT, PDF.js, gamepads, camera
          # and recording, MHTML, accessibility, libwpe, the DRM and headless platforms, MiniBrowser, tracing):
          # less to build, ship and attack. After Debian's own flags, so these win.
          trim="-DENABLE_MINIBROWSER=OFF -DENABLE_SPEECH_SYNTHESIS=OFF -DUSE_FLITE=OFF -DENABLE_SPELLCHECK=OFF"
          trim+=" -DENABLE_XSLT=OFF -DENABLE_PDFJS=OFF -DENABLE_GAMEPAD=OFF -DENABLE_MEDIA_STREAM=OFF -DENABLE_MEDIA_RECORDER=OFF"
          trim+=" -DENABLE_MHTML=OFF -DUSE_ATK=OFF -DENABLE_WPE_LEGACY_API=OFF -DENABLE_WPE_PLATFORM_DRM=OFF"
          trim+=" -DENABLE_WPE_PLATFORM_HEADLESS=OFF -DUSE_SYSPROF_CAPTURE=OFF"
          sed -i "s|^\tdh_auto_configure -- \$(EXTRA_CMAKE_ARGUMENTS)\$|& $trim|" debian/rules
          grep -q "ENABLE_SPEECH_SYNTHESIS=OFF" debian/rules
          sed -i '/MiniBrowser/d' debian/libwpewebkit-2.0-1.install  # a listed file that isn't built stops the build
          # WebCore's unified sources take 2-3 GB each to compile: one job per 4 GB, or the compiler is killed
          jobs=$(( $(free -g | awk '/^Mem:/{print $2}') / 4 )); jobs=$(( jobs < 1 ? 1 : jobs > $(nproc) ? $(nproc) : jobs ))
          echo "$(nproc) CPUs, $(free -g | awk '/^Mem:/{print $2}') GB: $jobs jobs"
          start=$(date +%s)
          # No debug info (the -g Debian's rules turn into -g1): smaller objects, a quicker link
          DEB_CFLAGS_STRIP="-g" DEB_CXXFLAGS_STRIP="-g" \
            DEB_BUILD_OPTIONS="nocheck nodoc noautodbgsym parallel=$jobs" dpkg-buildpackage -B -us -uc
          echo "Build took $(( ($(date +%s) - start) / 60 )) minutes"

      - name: Save the compiler cache (also after a timeout, so the next run goes on from here)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-${{ inputs.version }}-${{ github.run_id }}

      - name: Cache
        if: always()
        run: ccache -s || true

      - uses: actions/upload-artifact@v7
        with:
          name: debs
          path: src/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: debs
          path: debs

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          cd debs
          # GitHub turns the ~ of a Debian version into . in asset names; rename first, so SHA256SUMS
          # names the files as they are served (apt reads the version from inside the package)
          for f in *~*.deb; do mv "$f" "${f//\~/.}"; done
          sha256sum *.deb > SHA256SUMS
          tag="v${VERSION}-mirrordash${MIRRORDASH_BUILD}"
          gh release create "$tag" *.deb SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "WPE WebKit $VERSION for trixie arm64" --notes \
            "Debian sid's wpewebkit $VERSION (https://tracker.debian.org/pkg/wpewebkit), rebuilt for Debian trixie arm64 by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID): no debug info, no precompiled headers, and without speech, spell checking, XSLT, PDF.js, gamepads, camera and recording, MHTML, accessibility, libwpe, the DRM and headless platforms and MiniBrowser. Check the files with SHA256SUMS."

name: Build

# Debian sid's wpewebkit, rebuilt for trixie arm64 without the features the mirror never uses, and
# published as a release that the MirrorDash OS image installs. Trixie's own WPE (2.48.3) gets no security fixes ("wpewebkit is
# generally unsupported from bookworm onwards", Debian's security-support.deb13).
# Started by check.yml when sid has a new version, or by hand.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Debian source version of wpewebkit (sid), e.g. 2.54.2-1"
        required: true

permissions:
  contents: read

env:
  # Our build of a Debian version: one up when the build itself changes (the package's version and the tag)
  MIRRORDASH_BUILD: "3"

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    container: debian:trixie
    defaults:
      run:
        shell: bash  # a container step runs sh otherwise
    env:
      VERSION: ${{ inputs.version }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPRESS: "1"
      # Debian's rules pick clang through CMake; CMake reads these as its compiler launcher
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      DEBFULLNAME: MirrorDash CI
      DEBEMAIL: noreply@github.com
    steps:
      - name: Tools and Debian's signed source
        run: |
          [[ "$VERSION" =~ ^[0-9][0-9.]*-[0-9]+$ ]] || { echo "Not a Debian version: $VERSION"; exit 1; }
          apt-get update
          apt-get install -y --no-install-recommends devscripts debian-keyring ccache ca-certificates dpkg-dev equivs procps curl
          mkdir src && cd src
          # dget checks the .dsc's signature against Debian's keyring and the files against the .dsc
          dget "https://deb.debian.org/debian/pool/main/w/wpewebkit/wpewebkit_${VERSION}.dsc"

      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-${{ inputs.version }}-${{ github.run_id }}
          restore-keys: ccache-

      - name: Build
        timeout-minutes: 330
        run: |
          cd src/wpewebkit-*/
          apt-get build-dep -y .
          # The release notes: Debian's own entries since the version of the last release (its security fixes
          # list WebKit's WSA numbers), and the runtime dependencies against the last release's
          last=$(curl -fsSI "https://github.com/$GITHUB_REPOSITORY/releases/latest" | awk -F/ 'tolower($1) ~ /^location:/ {print $NF}' | tr -d '\r') || true
          last_version=$(sed -nE 's/^v(.+)-mirrordash[0-9]+$/\1/p' <<< "$last")
          {
            echo "## Debian's changes since the last release (${last:-none})"
            if [ -z "$last_version" ]; then echo "(no earlier release)"
            elif [ "$last_version" = "$VERSION" ]; then echo "The same Debian version: only this build changed."
            else echo '```'; dpkg-parsechangelog --since "$last_version" -S Changes; echo '```'; fi
          } > ../../NOTES.md
          dch -b -v "${VERSION}~mirrordash${MIRRORDASH_BUILD}" --distribution trixie --force-distribution \
            "Rebuilt for trixie, whose own WPE gets no security fixes, without what the MirrorDash screen never uses."
          # No precompiled headers: each runner builds them with different bytes, so ccache could reuse
          # no object compiled against one (learnt from dariyooo/wpe-webkit-binaries)
          sed -i 's/^EXTRA_CMAKE_ARGUMENTS = -DPORT=WPE /&-DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON /' debian/rules
          grep -q DISABLE_PRECOMPILE_HEADERS debian/rules
          # Off: what the mirror's screen never uses (speech, spell checking, XSLT, PDF.js, accessibility,
          # libwpe, the DRM and headless platforms): less to ship and attack. Only WebKit's public build
          # options, the ones it supports packagers changing; after Debian's own flags, so these win.
          trim="-DENABLE_SPEECH_SYNTHESIS=OFF -DUSE_FLITE=OFF -DENABLE_SPELLCHECK=OFF -DENABLE_XSLT=OFF"
          trim+=" -DENABLE_PDFJS=OFF -DUSE_ATK=OFF -DENABLE_WPE_LEGACY_API=OFF"
          trim+=" -DENABLE_WPE_PLATFORM_DRM=OFF -DENABLE_WPE_PLATFORM_HEADLESS=OFF"
          sed -i "s|^\tdh_auto_configure -- \$(EXTRA_CMAKE_ARGUMENTS)\$|& $trim|" debian/rules
          grep -q "ENABLE_SPEECH_SYNTHESIS=OFF" debian/rules  # Debian's rules changed: look at the line again
          # WebCore's unified sources take 2-3 GB each to compile: one job per 4 GB, or the compiler is killed
          jobs=$(( $(free -g | awk '/^Mem:/{print $2}') / 4 )); jobs=$(( jobs < 1 ? 1 : jobs > $(nproc) ? $(nproc) : jobs ))
          echo "$(nproc) CPUs, $(free -g | awk '/^Mem:/{print $2}') GB: $jobs jobs"
          start=$(date +%s)
          # No debug info (the -g Debian's rules turn into -g1): smaller objects, a quicker link
          DEB_CFLAGS_STRIP="-g" DEB_CXXFLAGS_STRIP="-g" \
            DEB_BUILD_OPTIONS="nocheck nodoc noautodbgsym parallel=$jobs" dpkg-buildpackage -B -us -uc 2>&1 | tee ../build.log
          # CMake only warns about an option it doesn't know: one WebKit renamed would quietly be back on
          unknown=$(grep -A30 "Manually-specified variables were not used" ../build.log \
            | grep -oE "^ +[A-Z_0-9]+" | tr -d " " | grep -xF -f <(grep -oE -- "-D[A-Z_0-9]+=" <<< "$trim" | sed "s/^-D//; s/=$//")) || true
          [ -z "$unknown" ] || { echo "::error::WebKit no longer knows: $unknown; find what they are called now"; exit 1; }
          echo "Build took $(( ($(date +%s) - start) / 60 )) minutes"

      - name: Save the compiler cache (also after a timeout, so the next run goes on from here)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-${{ inputs.version }}-${{ github.run_id }}

      - name: Cache
        if: always()
        run: ccache -s || true

      - name: What the packages need, against the last release
        run: |
          dpkg-deb -f src/libwpewebkit-2.0-1_*.deb Depends | tr ',' '\n' | sed 's/^ *//' | sort > DEPENDS.txt
          {
            echo; echo "## Runtime dependencies against the last release"
            if curl -fsSL -o /tmp/last-depends "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/DEPENDS.txt"; then
              echo '```diff'; diff -u /tmp/last-depends DEPENDS.txt | tail -n +3 || true; echo '```'
            else echo "(the last release has no DEPENDS.txt)"; fi
          } >> NOTES.md

      - uses: actions/upload-artifact@v7
        with:
          name: debs
          path: |
            src/*.deb
            NOTES.md
            DEPENDS.txt
          if-no-files-found: error

  # MirrorDash's launcher on the new packages in a headless labwc: a build that doesn't run is never released
  test:
    needs: build
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - name: Tools
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates > /dev/null

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: debs
          path: built

      - name: Smoke test
        run: ./smoke-test.sh built/src

  release:
    needs: [build, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: debs
          path: debs

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          mv debs/src/*.deb debs/ && rmdir debs/src
          cd debs
          # GitHub turns the ~ of a Debian version into . in asset names; rename first, so SHA256SUMS
          # names the files as they are served (apt reads the version from inside the package)
          for f in *~*.deb; do mv "$f" "${f//\~/.}"; done
          sha256sum *.deb > SHA256SUMS
          tag="v${VERSION}-mirrordash${MIRRORDASH_BUILD}"
          {
            echo "Debian sid's wpewebkit $VERSION (https://tracker.debian.org/pkg/wpewebkit), rebuilt for Debian trixie arm64 by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID): no debug info, no precompiled headers, and without speech, spell checking, XSLT, PDF.js, accessibility, libwpe and the DRM and headless platforms. MirrorDash's launcher ran on it (smoke-test.sh). Check the files with SHA256SUMS."
            echo
            cat NOTES.md
          } > ../notes.md
          gh release create "$tag" *.deb SHA256SUMS DEPENDS.txt --repo "$GITHUB_REPOSITORY" --title "WPE WebKit $VERSION for trixie arm64" --notes-file ../notes.md

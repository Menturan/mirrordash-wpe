name: Build

# Debian sid's wpewebkit, rebuilt for trixie arm64 without the features the mirror never uses, and
# published as a release that the MirrorDash OS image installs. Trixie's own WPE (2.48.3) gets no security fixes ("wpewebkit is
# generally unsupported from bookworm onwards", Debian's security-support.deb13).
# Started by check.yml when sid has a new version, or by hand.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Debian source version of wpewebkit (sid), e.g. 2.54.2-1"
        required: true

permissions:
  contents: read

env:
  # Our build of a Debian version: one up when the build itself changes (the package's version and the tag)
  MIRRORDASH_BUILD: "3"

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    container: debian:trixie
    defaults:
      run:
        shell: bash  # a container step runs sh otherwise
    env:
      VERSION: ${{ inputs.version }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPRESS: "1"
      # Debian's rules pick clang through CMake; CMake reads these as its compiler launcher
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      DEBFULLNAME: MirrorDash CI
      DEBEMAIL: noreply@github.com
    steps:
      - uses: actions/checkout@v7

      - name: Tools and Debian's signed source
        run: |
          [[ "$VERSION" =~ ^[0-9][0-9.]*-[0-9]+$ ]] || { echo "Not a Debian version: $VERSION"; exit 1; }
          apt-get update
          apt-get install -y --no-install-recommends devscripts debian-keyring ccache ca-certificates dpkg-dev equivs procps curl
          mkdir src && cd src
          # dget checks the .dsc's signature against Debian's keyring and the files against the .dsc
          dget "https://deb.debian.org/debian/pool/main/w/wpewebkit/wpewebkit_${VERSION}.dsc"

      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-${{ inputs.version }}-${{ github.run_id }}
          restore-keys: ccache-

      - name: Build
        timeout-minutes: 330
        run: ./build.sh

      - name: Save the compiler cache (also after a timeout, so the next run goes on from here)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-${{ inputs.version }}-${{ github.run_id }}

      - name: Cache
        if: always()
        run: ccache -s || true

      - uses: actions/upload-artifact@v7
        with:
          name: debs
          path: |
            src/*.deb
            NOTES.md
            DEPENDS.txt
          if-no-files-found: error

  # MirrorDash's launcher on the new packages in a headless labwc: a build that doesn't run is never released
  test:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    container: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - name: Tools
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates > /dev/null

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: debs
          path: built

      - name: Smoke test
        run: ./smoke-test.sh built/src

  release:
    needs: [build, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: debs
          path: debs

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          mv debs/src/*.deb debs/ && rmdir debs/src
          cd debs
          # GitHub turns the ~ of a Debian version into . in asset names; rename first, so SHA256SUMS
          # names the files as they are served (apt reads the version from inside the package)
          for f in *~*.deb; do mv "$f" "${f//\~/.}"; done
          sha256sum -- *.deb > SHA256SUMS
          tag="v${VERSION}-mirrordash${MIRRORDASH_BUILD}"
          {
            echo "Debian sid's wpewebkit $VERSION (https://tracker.debian.org/pkg/wpewebkit), rebuilt for Debian trixie arm64 by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID): no debug info, no precompiled headers, and without speech, spell checking, XSLT, PDF.js, accessibility, libwpe and the DRM and headless platforms. MirrorDash's launcher ran on it (smoke-test.sh). Check the files with SHA256SUMS."
            echo
            cat NOTES.md
          } > ../notes.md
          gh release create --repo "$GITHUB_REPOSITORY" --title "WPE WebKit $VERSION for trixie arm64" --notes-file ../notes.md -- "$tag" *.deb SHA256SUMS DEPENDS.txt
